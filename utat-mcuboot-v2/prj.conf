CONFIG_GPIO=y

# App must be built for MCUboot when used as a slot image
CONFIG_BOOTLOADER_MCUBOOT=y
# Enable image manager and required services for image activation
CONFIG_IMG_MANAGER=y
CONFIG_FLASH=y
CONFIG_REBOOT=y
# Required to build subsys/dfu/boot/mcuboot.c, which provides
# boot_is_img_confirmed / boot_write_img_confirmed / boot_request_upgrade
CONFIG_STREAM_FLASH=y
# Required so the app links MCUboot's bootutil library itself (needed for
# direct-xip-with-revert, where the app-side confirm/upgrade calls touch
# the same image-trailer logic the bootloader uses)
CONFIG_MCUBOOT_BOOTUTIL_LIB=y