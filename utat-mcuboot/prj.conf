CONFIG_GPIO=y
# App must be built for MCUboot when used as a slot image
CONFIG_BOOTLOADER_MCUBOOT=y
# IMG_MANAGER is a Kconfig <choice>; MCUBOOT_IMG_MANAGER selects the
# mcuboot-specific branch of it. Without this, subsys/dfu/boot/mcuboot.c
# (which defines boot_is_img_confirmed / boot_write_img_confirmed /
# boot_request_upgrade) never gets compiled, regardless of IMG_MANAGER=y.
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_IMG_MANAGER=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_REBOOT=y